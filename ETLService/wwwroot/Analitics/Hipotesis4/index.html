<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Hipótesis 4 - Learning Analytics</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.min.js"></script>

    <script defer>
        async function cargarGraficoHipotesis4() {
            try {
                // Petición al controlador expuesto de la Hipótesis 4
                const respuesta = await fetch('/api/CuartaHipotesis/hipotesis4');
                const datosAnaliticos = await respuesta.json();

                // 1. Renderizar Métricas de Resumen de Regresión y Conclusión
                document.getElementById("txtIntercept").innerText = `Intercepto (α): ${datosAnaliticos.Intercept}`;
                document.getElementById("txtCoeficientes").innerText = `Coeficientes: Rating (β1) = ${datosAnaliticos.CoeficienteRating} | Precio (β2) = ${datosAnaliticos.CoeficientePrecio}`;
                document.getElementById("txtFormula").innerText = `Ecuación: Progreso = ${datosAnaliticos.Intercept} + (${datosAnaliticos.CoeficienteRating} * Rating) + (${datosAnaliticos.CoeficientePrecio} * Precio)`;
                document.getElementById("txtR2").innerText = `Coeficiente de Determinación R²: ${datosAnaliticos.RCuadrado}`;
                document.getElementById("txtConclusion").innerText = `Conclusión: ${datosAnaliticos.Conclusion}`;

                // ==========================================
                // 2. CONFIGURACIÓN DEL GRÁFICO DE BURBUJAS (REGRESIÓN MULTIVARIABLE)
                // ==========================================
                const ctxBubble = document.getElementById('bubbleChart').getContext('2d');
                
                // Mapeamos los datos respetando las minúsculas del DTO JSON de .NET: { x: precio, y: progreso, r: rating }
                const bubblePoints = datosAnaliticos.BubbleData.map(p => ({
                    x: p.x,
                    y: p.y,
                    r: p.r // El radio ya viene escalado en el backend para una visualización óptima
                }));

                new Chart(ctxBubble, {
                    type: 'bubble',
                    data: {
                        datasets: [{
                            label: 'Cursos (Precio vs Progreso | Tamaño = Rating)',
                            data: bubblePoints,
                            backgroundColor: 'rgba(52, 152, 219, 0.6)',
                            borderColor: 'rgba(41, 128, 185, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            title: { display: true, text: 'Regresión: Impacto de Precio y Valoraciones en el Progreso' },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let p = context.raw;
                                        // Recuperamos el rating original deshaciendo el escalado (r / 4)
                                        let ratingOriginal = (p.r / 4).toFixed(2);
                                        return `Precio: $${p.x} | Progreso: ${p.y}% | Rating: ${ratingOriginal}⭐`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: { display: true, text: 'Precio Base del Curso ($)' }
                            },
                            y: {
                                title: { display: true, text: 'Progreso Final Estudiantil (%)' },
                                min: 0,
                                max: 100
                            }
                        }
                    }
                });

                // ==========================================
                // 3. CONFIGURACIÓN DE LA MATRIZ / MAPA DE CALOR (CORRELACIÓN)
                // ==========================================
                const ctxMatrix = document.getElementById('matrixChart').getContext('2d');

                new Chart(ctxMatrix, {
                    type: 'matrix',
                    data: {
                        datasets: [{
                            label: 'Matriz de Correlación de Pearson',
                            data: datosAnaliticos.CorrelationMatrix,
                            backgroundColor(context) {
                                if (!context.dataset.data[context.dataIndex]) return 'transparent';
                                const item = context.dataset.data[context.dataIndex];
                                const v = item.v; // Valor del coeficiente entre -1 y 1
                                
                                // Determinar la intensidad (Alfa) en base al valor absoluto de la correlación
                                const alpha = Math.abs(v);
                                
                                // Azul para correlaciones positivas, Rojo para negativas
                                return v >= 0 ? `rgba(46, 204, 113, ${alpha})` : `rgba(231, 76, 60, ${alpha})`;
                            },
                            borderColor: 'rgba(220, 220, 220, 1)',
                            borderWidth: 1,
                            // Dimensionamiento dinámico de las celdas en la cuadrícula de 3x3
                            width: ({ chart }) => chart.chartArea ? chart.chartArea.width / 3 - 2 : 0,
                            height: ({ chart }) => chart.chartArea ? chart.chartArea.height / 3 - 2 : 0
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            title: { display: true, text: 'Matriz de Correlación Cruzada (Pearson)' },
                            tooltip: {
                                callbacks: {
                                    label: (context) => `Variables: ${context.raw.x} x ${context.raw.y} | Coeficiente: ${context.raw.v}`
                                }
                            }
                        },
                        scales: {
                            x: {
                                type: 'category',
                                labels: ['Precio', 'Rating', 'Progreso'],
                                ticks: { display: true }
                            },
                            y: {
                                type: 'category',
                                labels: ['Precio', 'Rating', 'Progreso'],
                                ticks: { display: true },
                                offset: true
                            }
                        }
                    }
                });

            } catch (error) {
                console.error("Error al cargar la analítica de la Hipótesis 4:", error);
                document.getElementById("txtConclusion").innerText = "Error al conectar con la API de analítica.";
            }
        }

        // Inicializar el flujo al cargar el DOM
        cargarGraficoHipotesis4();
    </script>

    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div class="container">
        <h1>Análisis de la Hipótesis 4 (H4)</h1>
        <p><em>"Los cursos con mayores valoraciones promedio presentan mayores porcentajes de progreso estudiantil."</em></p>
        <p>Tipos de prueba: Correlación / Regresión</p>
        
        <div class="metrics-panel">
            <h2>Resultados</h2>
            <p id="txtIntercept" class="numericValue"></p>
            <p id="txtCoeficientes" class="numericValue"></p>
            <p id="txtFormula" class="numericValue" style="font-family: monospace; background: #fff; padding: 5px; border-radius: 4px; border: 1px solid #ddd;"></p>
            <p id="txtR2" class="numericValueStrong"></p>
            <hr class="textSeparator">
            <p id="txtConclusion" class="conclusion"></p>
        </div>

        <div class="chart-box">
            <h2>1. Análisis Multivariable (Gráfico de Burbujas)</h2>
            <canvas id="bubbleChart" width="800" height="400"></canvas>
        </div>

        <div class="chart-box">
            <h2>2. Matriz de Correlación Interactiva (Mapa de Calor)</h2>
            <div style="max-width: 500px; margin: 0 auto;">
                <canvas id="matrixChart" width="500" height="400"></canvas>
            </div>
        </div>
    </div>
</body>

</html>
