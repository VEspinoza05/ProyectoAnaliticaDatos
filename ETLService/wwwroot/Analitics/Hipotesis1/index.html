<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de la Hipótesis 1</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
    <script defer>
        async function cargarGraficoHipotesis() {
            // Se realiza la petición al controlador
            const respuesta = await fetch('/api/PrimeraHipotesis/hipotesis1');
            const datosAnaliticos = await respuesta.json();

            // Ojo con el mapeo usando camelCase para responder al estándar JSON de ASP.NET
            document.getElementById("txtCoeficienteModulo").innerText = `Coeficiente Módulo: ${datosAnaliticos.CoeficienteModulo}`;
            document.getElementById("txtCoeficienteDias").innerText = `Coeficiente Días: ${datosAnaliticos.CoeficienteDias}`;
            document.getElementById("txtIntercepto").innerText = `Intercepto: ${datosAnaliticos.Intercepto}`;
            document.getElementById("txtConclusion").innerText = datosAnaliticos.Conclusion;

            // Configurar grafico sigmoide
            const ctx = document.getElementById('sigmoidChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: datosAnaliticos.CurvaSigmoide.map(p => 'Día ' + p.Dia),
                    datasets: [{
                        label: 'Curva Logística (Probabilidad)',
                        // CORRECCIÓN 3: Se usa .probabilidad en minúscula inicial
                        data: datosAnaliticos.CurvaSigmoide.map(p => p.Probabilidad * 100),
                        showLine: true,       
                        fill: false,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderWidth: 3,
                        pointRadius: 4,       // Recomendado: Déjalo en un tamaño visible inicialmente para validar que se grafique
                        pointHoverRadius: 6,
                        tension: 0.4          // Suavizado óptimo para visualizar la curva en "S" (Sigmoide)
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            title: { display: true, text: 'Días transcurridos' }
                        },
                        y: {
                            title: { display: true, text: 'Probabilidad de éxito (%)' },
                            min: 0,
                            max: 100
                        }
                    },
                }
            });

            // Grafico de barras
            const bar = document.getElementById('StackedBars').getContext('2d');
            new Chart(bar, {
                type: 'bar',
                data: {
                    labels: ['Completó en Semana 1 (Sí)', 'No Completó en Semana 1 (No)'],
                    datasets: [{
                        label: 'Exito',
                        data: [datosAnaliticos.BarrasApiladas100["SiCompletó_Exito"],datosAnaliticos.BarrasApiladas100["NoCompletó_Exito"]],
                        backgroundColor: 'red'
                    }, {
                        label: 'Abandono',
                        data: [datosAnaliticos.BarrasApiladas100["SiCompletó_Abandono"],datosAnaliticos.BarrasApiladas100["NoCompletó_Abandono"]],
                        backgroundColor: 'blue'
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { stacked: true },
                        y: {
                            stacked: true,
                        }
                    }
                }
            });
        }

        cargarGraficoHipotesis();
    </script>
</head>

<body>
    <div class="container">
        <h1>Análisis de la Hipótesis 1</h1>    
        <p><em>"Los estudiantes que completan el primer módulo durante la primera semana presentan mayor probabilidad de finalizar el curso."</em></p>
        <p>Tipos de prueba: Regresión logística</p>

        <div class="metrics-panel">
            <h2>Resultados</h2>
            <p id="txtCoeficienteModulo" class="numericValueStrong"></p>
            <p id="txtCoeficienteDias" class="numericValueStrong"></p>
            <p id="txtIntercepto" class="numericValueStrong"></p>
            <hr class="textSeparator">
            <p id="txtConclusion" class="conclusion"></p>
        </div>

        <div class="chart-box">
            <canvas id="sigmoidChart" width="800" height="400"></canvas>
        </div>

        <div class="chart-box">
            <canvas id="StackedBars" width="800" height="400"></canvas>
        </div>
    </div>
</body>

</html>
