<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Hipótesis 2 - Learning Analytics</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.4.4/build/index.umd.min.js"></script>

    <script defer>
        let scatterChart = null;
        let boxplotChart = null;

        async function cargarGraficoHipotesis2(fechaInicio, fechaFin) {
            try {
                let url = '/api/SegundaHipotesis/hipotesis2';

                // Si ambas fechas existen, agregamos la query
                if (fechaInicio && fechaFin) {
                    url += `?Desde=${fechaInicio}&Hasta=${fechaFin}`;
                }

                const respuesta = await fetch(url);

                if (!respuesta.ok) {
                    throw new Error(`Error HTTP: ${respuesta.status}`);
                }

                const datosAnaliticos = await respuesta.json();

                console.log("Datos en scatter data" + datosAnaliticos.ScatterData.length)

                // Métricas
                document.getElementById("txtPearson").innerText =
                    `Coeficiente R de Pearson: ${datosAnaliticos.CoeficienteCorrelacion}`;

                document.getElementById("txtAnovaF").innerText =
                    `Estadístico F (ANOVA): ${datosAnaliticos.StatF}`;

                document.getElementById("txtPValue").innerText =
                    `Valor p: ${datosAnaliticos.ValorP} (${
                        datosAnaliticos.EsSignificativo
                            ? "Significativo"
                            : "No Significativo"
                    })`;

                document.getElementById("txtConclusionH2").innerText =
                    datosAnaliticos.Conclusion;

                // ==========================
                // Scatter
                // ==========================
                const ctxScatter =
                    document.getElementById('scatterChart').getContext('2d');

                const scatterPoints = datosAnaliticos.ScatterData.map(p => ({
                    x: p.X,
                    y: p.Y
                }));

                if (scatterChart) {
                    scatterChart.destroy();
                }

                scatterChart = new Chart(ctxScatter, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: 'Estudiantes (Actividad vs Tiempo en minutos)',
                            data: scatterPoints,
                            backgroundColor: 'rgba(54, 162, 235, 0.6)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            pointRadius: 4,
                            pointHoverRadius: 6
                        }]
                    },
                    options: {
                        responsive: true
                    }
                });

                // ==========================
                // Boxplot
                // ==========================
                const ctxBoxplot =
                    document.getElementById('boxplotChart').getContext('2d');

                const boxplotLabels =
                    datosAnaliticos.BoxplotData.map(b => b.Categoria);

                const boxplotValues =
                    datosAnaliticos.BoxplotData.map(b => ({
                        min: b.Minimo,
                        q1: b.Q1,
                        median: b.Mediana,
                        q3: b.Q3,
                        max: b.Maximo
                    }));

                if (boxplotChart) {
                    boxplotChart.destroy();
                }

                boxplotChart = new Chart(ctxBoxplot, {
                    type: 'boxplot',
                    data: {
                        labels: boxplotLabels,
                        datasets: [{
                            label: 'Distribución de Calificaciones',
                            data: boxplotValues,
                            backgroundColor: 'rgba(255, 99, 132, 0.5)',
                            borderColor: 'rgba(255, 99, 132, 1)',
                            borderWidth: 2,
                            itemRadius: 0
                        }]
                    },
                    options: {
                        responsive: true
                    }
                });

            } catch (error) {
                console.error("Error al cargar la analítica:", error);
            }
        }

 
    </script>

    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div class="container">
        <h1>Análisis de la Hipótesis 2 (H2)</h1>
        <p><em>"Los estudiantes con mayor nivel de actividad presentan mejor rendimiento académico final."</em></p>
        <p>Tipos de prueba: Correlación / ANOVA</p>
        
        <div class="date-panel">
            <div>
                <p class="input-label">Desde</p>
                <input type="date" id="fecha-inicio" name="desde" value="2026-01-01">
            </div>
            <div>
                <p class="input-label">Hasta</p>
                <input type="date" id="fecha-fin" name="hasta" value="2026-03-31">
            </div>
            <button id="filter-btn">Filtrar</button>
        </div>

        <div class="metrics-panel">
            <h2>Resultados</h2>
            <p id="txtPearson" class="numericValue"></p>
            <hr class="textSeparator">
            <p id="txtAnovaF" class="numericValue"></p>
            <p id="txtPValue" class="numericValueStrong"></p>
            <p id="txtConclusionH2" class="conclusion"></p>
        </div>

        <div class="chart-box">
            <h2>1. Prueba de Correlación (Análisis Continuo)</h2>
            <canvas id="scatterChart" width="800" height="400"></canvas>
        </div>

        <div class="chart-box">
            <h2>2. Prueba ANOVA (Análisis Categórico)</h2>
            <canvas id="boxplotChart" width="800" height="400"></canvas>
        </div>
    </div>
    <script>
        const filterButton = document.getElementById("filter-btn");

        filterButton.addEventListener("click", () => {
            const fechaInicio =
                document.getElementById("fecha-inicio").value;

            const fechaFin =
                document.getElementById("fecha-fin").value;

            cargarGraficoHipotesis2(fechaInicio, fechaFin);
        });

        // Carga inicial sin parámetros.
        // La API usará las fechas por defecto.
        cargarGraficoHipotesis2();
    </script>
</body>

</html>
